# Alembic configuration.
#
# NOTE: this file is intentionally ASCII-only.
# Python's configparser reads .ini files with `encoding="locale"`, which on a
# Chinese Windows box means GBK -- so UTF-8 Chinese comments here crash Alembic
# with UnicodeDecodeError. Keep .ini files ASCII; put explanations in code.
#
# sqlalchemy.url is intentionally left empty: the connection URL is injected by
# migrations/env.py, which reads the application's own settings (.env or real
# environment variables). Hardcoding it here would force us to maintain the URL
# in three places (local / container / CI) and they would drift apart.

[alembic]
script_location = migrations

# Make the paper_manage package importable when alembic runs.
# The editable install already handles this, but being explicit keeps it working
# even in a stripped-down environment.
prepend_sys_path = .

# Tell alembic how to split prepend_sys_path. Without it, newer alembic versions
# emit a DeprecationWarning and fall back to legacy splitting on spaces/commas.
path_separator = os

# Migration file naming: date_revision_slug.py
# Filename order == execution order, and the history reads as a timeline.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
